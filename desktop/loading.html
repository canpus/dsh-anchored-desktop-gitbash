<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>DeepSeek Harness</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0f172a;
      color: #e2e8f0;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #334155;
      border-top-color: #7dd3fc;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status {
      font-size: 15px;
      letter-spacing: 0.5px;
      color: #94a3b8;
      text-align: center;
      max-width: 80%;
      line-height: 1.8;
    }
    .hint {
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div id="status">正在准备环境…</div>
  <div class="hint">首次启动需重建依赖链接（约 1-5 分钟，纯本地、免联网、免管理员）</div>
</body>
</html>
